name: Test and deploy API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# one deploy at a time, so that two pushes do not race for the build repository
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false # otherwise the workflow token overrides GH_TOKEN when publishing

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: 'npm'

    - run: npm ci
    - run: npm run typecheck
    - run: npm test

    # Koyeb deploys every new commit in book-monkey5/api5-build: one commit per deploy with the sources (without .github)
    - name: Publish sources to book-monkey5/api5-build
      if: ${{ github.event_name == 'push' }}
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/book-monkey5/api5-build.git" "$RUNNER_TEMP/build"
        git -C "$RUNNER_TEMP/build" rm -rq --ignore-unmatch .
        git archive HEAD | tar -x -C "$RUNNER_TEMP/build"
        rm -rf "$RUNNER_TEMP/build/.github"
        cd "$RUNNER_TEMP/build"
        git add -A
        git diff --cached --quiet && exit 0 # sources unchanged (e.g. only .github was modified)
        git -c user.name="The Buildbot" -c user.email="buildbot@angular2buch.de" commit -m "Deploy angular-buch/api5@${GITHUB_SHA}"
        git push origin HEAD:main
